name: Paired spot perpetual anticipation (no delivery)
on:
  push:
    branches: [tactical-early-v22]
    paths: [paired_market_features.mjs, test_paired_market_features.mjs, replay_paired_market.mjs, download_paired_market.py, .github/workflows/paired-market.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node test_paired_market_features.mjs
      - run: python3 download_paired_market.py /tmp/tactical-paired/spot spot
      - run: python3 download_paired_market.py /tmp/tactical-paired/perp futures/um
      - run: node replay_paired_market.mjs /tmp/tactical-paired
