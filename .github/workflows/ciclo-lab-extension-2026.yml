name: CICLO LAB extension model selftest
on:
  push:
    branches: [ciclo-lab-research]
    paths: [ciclo-lab/extension_2026.py, .github/workflows/ciclo-lab-extension-2026.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --only-binary=:all: --disable-pip-version-check numpy==2.2.6 pandas==2.2.3 scikit-learn==1.6.1
      - run: python -X faulthandler ciclo-lab/extension_2026.py --selftest
