name: CICLO LAB development backtest
on:
  push:
    branches: [ciclo-lab-research]
    paths: [ciclo-lab/execution.py, .github/workflows/ciclo-lab-execution.yml]
permissions:
  contents: read
  actions: read
jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --only-binary=:all: --disable-pip-version-check numpy==2.2.6 pandas==2.2.3
      - run: python -c "import sys,numpy,pandas; print(sys.version,numpy.__version__,pandas.__version__)"
      - run: python -X faulthandler -m py_compile ciclo-lab/market_frame.py ciclo-lab/execution.py
      - run: python -X faulthandler ciclo-lab/market_frame.py --selftest
      - run: python -X faulthandler ciclo-lab/execution.py --selftest
      - uses: actions/download-artifact@v4
        with:
          name: ciclo-lab-btcusdt-1m-2020-2026
          path: lab-dataset
          run-id: 45734087753
          github-token: ${{ github.token }}
      - run: python -X faulthandler ciclo-lab/execution.py --dataset lab-dataset
      - uses: actions/upload-artifact@v4
        with:
          name: ciclo-lab-development-results
          path: |
            lab-execution-summary.json
            lab-execution-trades.json
          retention-days: 30
