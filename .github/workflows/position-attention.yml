name: Lagged positioning anticipation (no delivery)
on:
  push:
    branches: [tactical-early-v22]
    paths: [position_attention.mjs, test_position_attention.mjs, replay_position_attention.mjs, download_position_attention.py, .github/workflows/position-attention.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node test_position_attention.mjs
      - run: python3 download_paired_market.py /tmp/tactical-position/spot spot
      - run: python3 download_position_attention.py /tmp/tactical-position
      - run: node replay_position_attention.mjs /tmp/tactical-position
