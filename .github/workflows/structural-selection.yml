name: Structural selection research (no delivery)
on:
  push:
    branches: [tactical-early-v22]
    paths: [structural_research.mjs, replay_structural_selection.mjs, test_structural_research.mjs, .github/workflows/structural-selection.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        offset: [0, 30, 60]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node test_structural_research.mjs
      - run: node replay_structural_selection.mjs
        env:
          REPLAY_OFFSET_DAYS: ${{ matrix.offset }}
