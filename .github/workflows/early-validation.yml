name: Early pattern validation
on:
  push:
    branches: [experimental-v2-1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npm test
      - run: node test_fast_tactical.mjs
      - run: node test_early_patterns.mjs
      - run: node --check fast_notify.mjs
      - run: node replay_observation.mjs
