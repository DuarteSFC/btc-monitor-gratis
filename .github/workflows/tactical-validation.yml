name: Tactical V2 validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node --check fast_notify.mjs
      - run: node test_fast_tactical.mjs
      - run: node test_tactical_candidate.mjs
  historical:
    strategy:
      fail-fast: false
      matrix:
        offset: [90, 180, 270, 360, 450]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node historical_tactical.mjs
        env:
          HISTORY_END_UTC: "2026-11-25T20:10:00.000Z"
          HISTORY_OFFSET_DAYS: ${{ matrix.offset }}
