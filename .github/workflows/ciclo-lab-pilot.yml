name: CICLO LAB isolated historical pilot
on:
  push:
    branches: [ciclo-lab-research]
    paths: [ciclo-lab/pilot.mjs, .github/workflows/ciclo-lab-pilot.yml]
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node --check ciclo-lab/pilot.mjs
      - run: node ciclo-lab/pilot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ciclo-lab-60d-pilot
          path: lab-output/
          retention-days: 30
