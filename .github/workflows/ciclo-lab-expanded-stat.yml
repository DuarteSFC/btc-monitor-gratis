name: CICLO LAB expanded joint statistical audit
on:
  push:
    branches: [ciclo-lab-research]
    paths: [ciclo-lab/expanded_stat.py, .github/workflows/ciclo-lab-expanded-stat.yml]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --only-binary=:all: --disable-pip-version-check numpy==2.2.6 pandas==2.2.3
      - run: python -X faulthandler ciclo-lab/expanded_stat.py --selftest
      - uses: actions/download-artifact@v4
        with:
          name: ciclo-lab-batch-futures
          path: audit-batch
          run-id: 45866038855
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ciclo-lab-hurdle-futures
          path: audit-hurdle
          run-id: 45867003715
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ciclo-lab-exit-grid
          path: audit-exit
          run-id: 45867520944
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ciclo-lab-portfolio-screen
          path: audit-portfolio
          run-id: 45867984261
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ciclo-lab-mixed-portfolio
          path: audit-mixed
          run-id: 45868736459
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ciclo-lab-known-trend
          path: audit-known
          run-id: 45871507129
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ciclo-lab-robust-delay
          path: audit-robust
          run-id: 45870129062
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ciclo-lab-moderate-delay
          path: audit-moderate
          run-id: 45870778103
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ciclo-lab-relative-delay
          path: audit-relative
          run-id: 45871277699
          github-token: ${{ github.token }}
      - run: python -X faulthandler ciclo-lab/expanded_stat.py
      - uses: actions/upload-artifact@v4
        with:
          name: ciclo-lab-expanded-stat
          path: lab-expanded-stat.json
          retention-days: 30
