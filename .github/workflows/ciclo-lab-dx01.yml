name: CICLO LAB DX01 extra futures history
on:
  push:
    branches: [ciclo-lab-research]
    paths: [ciclo-lab/derivative_extra.py, .github/workflows/ciclo-lab-dx01.yml]
permissions:
  contents: read
jobs:
  acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m py_compile ciclo-lab/derivative_extra.py
          python -X faulthandler ciclo-lab/derivative_extra.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ciclo-lab-dx01
          path: lab-dx01/
          retention-days: 30
