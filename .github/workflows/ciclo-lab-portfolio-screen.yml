name: CICLO LAB frozen multi-model portfolio screen
on:
  push:
    branches: [ciclo-lab-research]
    paths: [ciclo-lab/portfolio_screen.py, .github/workflows/ciclo-lab-portfolio-screen.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --only-binary=:all: --disable-pip-version-check numpy==2.2.6 pandas==2.2.3 scikit-learn==1.6.1
      - run: python -X faulthandler ciclo-lab/portfolio_screen.py --selftest
      - uses: actions/download-artifact@v4
        with:
          name: ciclo-lab-btcusdt-1m-2020-2026
          path: lab-dataset
          run-id: 45734087753
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ciclo-lab-derivatives-2021-2023
          path: lab-derivatives
          run-id: 45861953804
          github-token: ${{ github.token }}
      - run: python -X faulthandler ciclo-lab/portfolio_screen.py --dataset lab-dataset --derivatives lab-derivatives
      - uses: actions/upload-artifact@v4
        with:
          name: ciclo-lab-portfolio-screen
          path: lab-portfolio-screen.json
          retention-days: 30
