name: CICLO LAB MS01 real data feature audit
on:
  push:
    branches: [ciclo-lab-research]
    paths: [ciclo-lab/ms01_feature_audit.py, .github/workflows/ciclo-lab-ms01-feature-audit.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --only-binary=:all: --disable-pip-version-check numpy==2.2.6 pandas==2.2.3 scikit-learn==1.6.1
      - run: python -X faulthandler ciclo-lab/ms01_feature_audit.py --selftest
      - uses: actions/download-artifact@v4
        with:
          name: ciclo-lab-derivatives-2021-2023
          path: lab-derivatives
          run-id: 45861953804
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ciclo-lab-derivatives-2026-extension
          path: lab-extension
          run-id: 45995404482
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ciclo-lab-microstructure
          path: audit-ms0
          run-id: 45998213640
          github-token: ${{ github.token }}
      - run: python -X faulthandler ciclo-lab/ms01_feature_audit.py --derivatives lab-derivatives --extension lab-extension
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ciclo-lab-ms01-feature-audit
          path: lab-ms01-tech.json
          retention-days: 30
