name: BTC fast module tests
on:
  pull_request:
  push:
    branches: [main, fast-tactical-5m-15m]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: |
          npm test
          node test_fast_tactical.mjs
          node test_early_market.mjs
          node --check api/fast.mjs
          node --check api/tactical.mjs
          node --check fast_notify.mjs
          node test_tactical_candidate.mjs
          node test_fast_notify.mjs
