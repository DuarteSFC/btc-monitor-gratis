name: Net utility ranking on new windows (no delivery)
on:
  push:
    branches: [tactical-early-v22]
    paths: [utility_attention.mjs, test_utility_attention.mjs, replay_utility_attention.mjs, download_utility_flow.py, .github/workflows/utility-attention.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node test_utility_attention.mjs
      - run: python3 download_utility_flow.py /tmp/tactical-utility
      - run: node replay_utility_attention.mjs /tmp/tactical-utility
