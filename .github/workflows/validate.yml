name: BTC monitor gratis - pruebas
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar sintaxis
        run: node --check worker.mjs
      - name: Pruebas simuladas - sin trading
        run: |
          node test_worker.mjs
          node test_context.mjs
          node test_technical_context.mjs
          node test_risk.mjs
          node test_derivatives.mjs
          node test_risk.mjs
          node --check api/report.mjs
          node --check api/health.mjs

  market-live-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar cotizaciones publicas e indicadores reales
        run: node market_smoke.mjs


  http-endpoint-live:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probar endpoint remoto HTTP sin cache
        run: node test_http_endpoint.mjs

  test-source-fallbacks:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probar fuentes reales alternativas B y C
        run: node test_live_failover.mjs
