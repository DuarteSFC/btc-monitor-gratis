name: BTC monitor gratis - pruebas
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar sintaxis
        run: node --check worker.mjs
      - name: Pruebas simuladas - sin trading
        run: node test_worker.mjs

  market-live-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar cotizaciones publicas e indicadores reales
        run: node market_smoke.mjs

  inspect-free-sources:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar fuentes ETF on-chain liquidaciones
        run: node probe_sources.mjs
      - name: Inspeccionar esquemas del respaldo
        run: node probe_shapes.mjs
