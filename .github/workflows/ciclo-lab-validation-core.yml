name: CICLO LAB validation core synthetic and development parity
on:
  push:
    branches: [ciclo-lab-research]
    paths: [ciclo-lab/validation_core.py, .github/workflows/ciclo-lab-validation-core.yml]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --only-binary=:all: --disable-pip-version-check numpy==2.2.6 pandas==2.2.3
      - run: python -X faulthandler ciclo-lab/validation_core.py --selftest
      - uses: actions/download-artifact@v4
        with:
          name: ciclo-lab-portfolio-screen
          path: audit-portfolio
          run-id: 45867984261
          github-token: ${{ github.token }}
      - run: python -X faulthandler ciclo-lab/validation_core.py
      - uses: actions/upload-artifact@v4
        with:
          name: ciclo-lab-validation-core
          path: lab-validation-core.json
          retention-days: 30
