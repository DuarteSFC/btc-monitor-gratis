name: Directional pre-impulse comparison (no delivery)
on:
  push:
    branches: [tactical-early-v22]
    paths: [direction_attention.mjs, test_direction_attention.mjs, replay_direction_attention.mjs, download_direction_flow.py, .github/workflows/direction-attention.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node test_direction_attention.mjs
      - run: python3 download_direction_flow.py /tmp/tactical-direction
      - run: node replay_direction_attention.mjs /tmp/tactical-direction
