name: CICLO LAB B03 entry-filter screen
on:
  push:
    branches: [ciclo-lab-research]
    paths: [ciclo-lab/b03_entry_filters.py, .github/workflows/ciclo-lab-b03-filters.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --only-binary=:all: --disable-pip-version-check numpy==2.2.6 pandas==2.2.3
      - run: python -X faulthandler ciclo-lab/b03_entry_filters.py --selftest
      - uses: actions/download-artifact@v4
        with:
          name: ciclo-lab-btcusdt-1m-2020-2026
          path: lab-dataset
          run-id: 45734087753
          github-token: ${{ github.token }}
      - run: python -X faulthandler ciclo-lab/b03_entry_filters.py --dataset lab-dataset
      - uses: actions/upload-artifact@v4
        with:
          name: ciclo-lab-b03-entry-filters
          path: lab-b03-entry-filters.json
          retention-days: 30
